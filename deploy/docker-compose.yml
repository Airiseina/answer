services:
  traefik:
    image: traefik:v3.0
    container_name: answer_traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - answer-net

  frontend:
    build:
      context: ../web/test_frontend
      dockerfile: Dockerfile
    container_name: answer_frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - answer-net
    depends_on:
      - api-gateway

  api-gateway:
    build:
      context: ..
      dockerfile: api_gateway/Dockerfile
    container_name: answer_api_gateway
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/login`) || PathPrefix(`/register`) || PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=10"
      - "traefik.http.services.api.loadbalancer.server.port=1234"
    env_file: .env
    environment:
      - ETCD_ADDR=etcd:2379
      - OTEL_ADDR=otel-collector:4317
      - SEAWEEDFS_FILER_URL=http://seaweedfs-filer:8888
    networks:
      - answer-net
    depends_on:
      - user-service
      - group-service
      - etcd
      - mysql
      - garnet
      - otel-collector

  msg-gateway:
    build:
      context: ..
      dockerfile: msg_gateway/Dockerfile
    container_name: answer_msg_gateway
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ws.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.ws.entrypoints=web"
      - "traefik.http.routers.ws.priority=20"
      - "traefik.http.services.ws.loadbalancer.server.port=8081"
    env_file: .env
    environment:
      - ETCD_ADDR=etcd:2379
      - OTEL_ADDR=otel-collector:4317
      - GATEWAY_ADDR=answer_msg_gateway:8081
      - SEAWEEDFS_FILER_URL=http://seaweedfs-filer:8888
      - KAFKA_BROKERS=kafka-1:9092
      - REDIS_ADDR=garnet:6379
    networks:
      - answer-net
    depends_on:
      - chat-service
      - etcd
      - otel-collector

  user-service:
    build:
      context: ..
      dockerfile: kitex_service/user_service/Dockerfile
    container_name: answer_user_service
    env_file: .env
    environment:
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-123456}
      - MYSQL_NAME=${MYSQL_NAME:-answer}
      - ETCD_ADDR=etcd:2379
      - OTEL_ADDR=otel-collector:4317
      - KITEX_IP_TO_REGISTRY=answer_user_service
    networks:
      - answer-net
    depends_on:
      - mysql
      - garnet
      - etcd
      - otel-collector

  group-service:
    build:
      context: ..
      dockerfile: kitex_service/group_service/Dockerfile
    container_name: answer_group_service
    env_file: .env
    environment:
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-123456}
      - MYSQL_NAME=${MYSQL_NAME:-answer}
      - ETCD_ADDR=etcd:2379
      - OTEL_ADDR=otel-collector:4317
      - KITEX_IP_TO_REGISTRY=answer_group_service
    networks:
      - answer-net
    depends_on:
      - mysql
      - etcd
      - otel-collector

  chat-service:
    build:
      context: ..
      dockerfile: kitex_service/chat_service/Dockerfile
    container_name: answer_chat_service
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456}
      - POSTGRES_DBNAME=${POSTGRES_DBNAME:-answer_chat}
      - REDIS_ADDR=${REDIS_ADDR:-garnet:6379}
      - ETCD_ADDR=etcd:2379
      - OTEL_ADDR=otel-collector:4317
      - KITEX_IP_TO_REGISTRY=answer_chat_service
      - CLICKHOUSE_ADDR=clickhouse:9000
      - CLICKHOUSE_USERNAME=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DB:-answer_cold}
      - COLD_STORAGE_ENABLED=true
      - COLD_STORAGE_HOT_MONTHS=6
    networks:
      - answer-net
    depends_on:
      - postgres
      - garnet
      - clickhouse
      - etcd
      - otel-collector

  knowledge-service:
     build:
       context: ..
       dockerfile: kitex_service/knowledge_service/Dockerfile
     container_name: answer_knowledge_service
     restart: unless-stopped
     env_file: .env
     environment:
       - MYSQL_HOST=${MYSQL_HOST:-mysql}
       - MYSQL_PORT=${MYSQL_PORT:-3306}
       - MYSQL_USER=${MYSQL_USER:-root}
       - MYSQL_PASSWORD=${MYSQL_PASSWORD:-123456}
       - MYSQL_NAME=${MYSQL_NAME:-answer}
       - ETCD_ADDR=etcd:2379
       - OTEL_ADDR=otel-collector:4317
       - KITEX_IP_TO_REGISTRY=answer_knowledge_service
       - KAFKA_BROKERS=kafka-1:9092
       - QDRANT_HOST=answer_qdrant
       - QDRANT_PORT=6334
       - MEILISEARCH_HOST=http://answer_meilisearch:7700
       - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY:-answer_meilisearch_key}
       - SEAWEEDFS_FILER_URL=http://seaweedfs-filer:8888
       - RERANK_ENABLED=${RERANK_ENABLED:-false}
       - RERANK_MODE=${RERANK_MODE:-jina}
       - RERANK_BASE_URL=${RERANK_BASE_URL:-https://api.jina.ai/v1}
       - RERANK_MODEL=${RERANK_MODEL:-jina-reranker-v2-base-multilingual}
       - RERANK_TOP_N=${RERANK_TOP_N:-3}
       - RERANK_API_KEY=${RERANK_API_KEY:-}
       - NEO4J_URI=bolt://neo4j:7687
       - NEO4J_USERNAME=neo4j
       - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
       - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
       - EMBEDDING_MODEL=${EMBEDDING_MODEL:-doubao-embedding-vision-251215}
     networks:
       - answer-net
     depends_on:
       - mysql
       - etcd
       - kafka-1
       - qdrant
       - meilisearch
       - neo4j
       - otel-collector

  bot-service:
    build:
      context: ..
      dockerfile: kitex_service/bot_service/Dockerfile
    container_name: answer_bot_service
    restart: unless-stopped
    env_file: .env
    environment:
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-123456}
      - MYSQL_NAME=${MYSQL_NAME:-answer}
      - ETCD_ADDR=etcd:2379
      - OTEL_ADDR=otel-collector:4317
      - KITEX_IP_TO_REGISTRY=answer_bot_service
      - SEAWEEDFS_FILER_URL=http://seaweedfs-filer:8888
    networks:
      - answer-net
    depends_on:
      - mysql
      - etcd
      - seaweedfs-filer
      - otel-collector
      - user-service
      - chat-service
      - knowledge-service

  work-service:
    build:
      context: ..
      dockerfile: kitex_service/work_service/Dockerfile
    container_name: answer_work_service
    restart: unless-stopped
    env_file: .env
    environment:
      - ETCD_ADDR=etcd:2379
      - OTEL_ADDR=otel-collector:4317
      - GATEWAY_ADDR=answer_msg_gateway:8081
      - KITEX_IP_TO_REGISTRY=answer_work_service
      - KAFKA_BROKERS=kafka-1:9092
      - MCP_MEM0_URL=http://answer_mcp_mem0:8000/sse
      - MCP_SEARXNG_URL=http://answer_mcp_searxng:8001/sse
      - MCP_WEATHER_URL=http://answer_mcp_weather:8080/sse
      - MCP_TIMESERVER_URL=http://answer_mcp_timeserver:8000/sse
      - SEAWEEDFS_FILER_URL=http://seaweedfs-filer:8888
      - SEAWEEDFS_BASE_PATH=/chat
      - SEAWEEDFS_PUBLIC_URL=/files
      - RAGAS_EVAL_URL=http://answer_ragas_eval:8090
    networks:
      - answer-net
    depends_on:
      - etcd
      - kafka-1
      - otel-collector
      - mcp-mem0
      - mcp-searxng
      - mcp-weather
      - mcp-timeserver
      - seaweedfs-filer

  postgres:
    image: postgres:16
    container_name: answer_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DBNAME:-answer_chat}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - answer-net

  # ClickHouse 冷库：存储归档的历史消息
  # 选择 ClickHouse 而非 SeaweedFS 的原因：
  # 1. SeaweedFS 是文件存储，适合存图片/文件等二进制数据，不适合存结构化消息数据做查询
  # 2. ClickHouse 是列式数据库，天然适合海量消息的存储和分析查询
  # 3. 支持按月分区、TTL 自动过期，与 PostgreSQL 分区策略一致
  # 4. Go 有成熟的 clickhouse-go/v2 客户端
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: answer_clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-answer_cold}
    ports:
      - "8123:8123"   # HTTP 接口
      - "9000:9000"   # Native TCP 接口（Go 客户端使用此端口）
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - answer-net

  mysql:
    image: mysql:8.0
    container_name: answer_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_NAME:-answer}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - answer-net

  garnet:
    image: ghcr.io/microsoft/garnet-alpine:1.1.8
    container_name: answer_garnet
    ports:
      - "6379:6379"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - garnet_data:/data
    networks:
      - answer-net

  kafka-1:
    image: apache/kafka:latest
    container_name: answer_kafka-1
    user: root
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9094:9094"
    volumes:
      - kafka_1_data:/tmp/kafka-logs
    networks:
      - answer-net

  kafka-2:
    image: apache/kafka:latest
    container_name: answer_kafka-2
    user: root
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9095:9095"
    volumes:
      - kafka_2_data:/tmp/kafka-logs
    networks:
      - answer-net
    depends_on:
      - kafka-1

  qdrant:
    image: qdrant/qdrant:latest
    container_name: answer_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - answer-net

  # Meilisearch: BM25关键词检索引擎，与Qdrant向量检索配合实现RAG混合检索
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: answer_meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_API_KEY:-answer_meilisearch_key}
      - MEILI_ENV=production
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - answer-net

  # Neo4j: 知识图谱引擎，与Qdrant向量检索+Meilisearch BM25配合实现三路混合检索
  neo4j:
    image: neo4j:5.26-community
    container_name: answer_neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - answer-net
    restart: unless-stopped

  seaweedfs-master:
    image: chrislusf/seaweedfs:3.78
    container_name: answer_seaweedfs_master
    command: "master -ip=seaweedfs-master -port=9333"
    ports:
      - "9333:9333"
    volumes:
      - seaweedfs_master_data:/data
    networks:
      - answer-net

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.78
    container_name: answer_seaweedfs_volume
    command: "volume -ip=seaweedfs-volume -port=8080 -mserver=seaweedfs-master:9333 -dir=/data"
    ports:
      - "8081:8080"
    volumes:
      - seaweedfs_volume_data:/data
    networks:
      - answer-net
    depends_on:
      - seaweedfs-master

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.78
    container_name: answer_seaweedfs_filer
    command: "filer -ip=seaweedfs-filer -master=seaweedfs-master:9333"
    ports:
      - "8888:8888"
    volumes:
      - seaweedfs_filer_data:/data
    networks:
      - answer-net
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume

  etcd:
    image: quay.io/coreos/etcd:v3.6.8
    container_name: answer_etcd
    command:
      - /usr/local/bin/etcd
      - --name=answer_etcd
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    networks:
      - answer-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: answer_jaeger
    ports:
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - answer-net

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: answer_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks:
      - answer-net
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:latest
    container_name: answer_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - answer-net

  # ==========================================
  # Mem0 记忆层 (自部署 MCP Server)
  # ==========================================
  mem0-postgres:
    image: pgvector/pgvector:pg16
    container_name: answer_mem0_postgres
    environment:
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: mem0_password
      POSTGRES_DB: mem0
    volumes:
      - mem0_postgres_data:/var/lib/postgresql/data
    networks:
      - answer-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp-mem0:
    build:
      context: ../mcp-servers/mem0
      dockerfile: Dockerfile
    container_name: answer_mcp_mem0
    ports:
      - "9004:8000"
    environment:
      - MEM0_API_KEY=${MEM0_API_KEY:-}
      - MEM0_HOST=mem0-postgres
      - MEM0_PORT=5432
      - MEM0_USER=mem0
      - MEM0_PASSWORD=mem0_password
      - MEM0_DB=mem0
      - QDRANT_HOST=answer_qdrant
      - QDRANT_PORT=6333
      - LLM_MODEL=${MEM0_LLM_MODEL}
      - LLM_BASE_URL=${MEM0_LLM_BASE_URL}
      - LLM_API_KEY=${MEM0_LLM_API_KEY}
      - EMBEDDING_MODEL=${MEM0_EMBEDDING_MODEL}
      - EMBEDDING_BASE_URL=${MEM0_EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${MEM0_EMBEDDING_API_KEY}
      - EMBEDDING_PROVIDER=${MEM0_EMBEDDING_PROVIDER:-volcengine}
      - EMBEDDING_DIMS=${MEM0_EMBEDDING_DIMS}
      - OPENAI_API_KEY=${MEM0_LLM_API_KEY}
    depends_on:
      mem0-postgres:
        condition: service_healthy
    networks:
      - answer-net
    restart: unless-stopped

  # ==========================================
  # MCP SSE Servers
  # ==========================================
  mcp-weather:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.mcp-weather
    container_name: answer_mcp_weather
    ports:
      - "9001:8080"
    networks:
      - answer-net
    restart: unless-stopped

  mcp-timeserver:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.mcp-timeserver
    container_name: answer_mcp_timeserver
    ports:
      - "9005:8000"
    networks:
      - answer-net
    restart: unless-stopped

  # ==========================================
  # Knowledge 知识库检索已从MCP改为直接RPC调用knowledge_service
  # 不再需要Python MCP Knowledge中间层
  # ==========================================

  # ==========================================
  # Rerank 精排服务 (vLLM + BGE-Reranker)
  # 通过vLLM部署BGE-Reranker，提供/score API进行精准打分精排
  # 仅在生产环境GPU可用时启用，开发环境使用Jina API模式
  # 启用方式: 设置 RERANK_MODE=vllm 并 docker compose --profile rerank up -d
  # ==========================================
  rerank:
    image: vllm/vllm-openai:latest
    container_name: answer_rerank
    profiles:
      - rerank
    ports:
      - "8010:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command:
      - serve
      - ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - --task
      - score
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - rerank_model_cache:/root/.cache/huggingface
    networks:
      - answer-net
    restart: unless-stopped

  # ==========================================
  # SearXNG 搜索引擎 + MCP Server
  # ==========================================
  searxng:
    image: searxng/searxng:latest
    container_name: answer_searxng
    ports:
      - "9007:8080"
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - answer-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/search?format=json&q=healthcheck&language=zh-CN || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s

  mcp-searxng:
    build:
      context: ../mcp-servers/searxng-go
      dockerfile: Dockerfile
    container_name: answer_mcp_searxng
    ports:
      - "9008:8001"
    environment:
      - SEARXNG_BASE_URL=http://answer_searxng:8080
      - SEARXNG_TIMEOUT=8
      - PORT=8001
    networks:
      - answer-net
    depends_on:
      searxng:
        condition: service_healthy
    restart: unless-stopped
  

  grafana:
    image: grafana/grafana:latest
    container_name: answer_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - answer-net
    depends_on:
      - prometheus

  # ==========================================
  # RAGAS 评估服务 (Docker化)
  # 提供REST API对RAG系统进行自动化评估
  # 评估指标: faithfulness, answer_relevance, context_precision, context_recall
  # ==========================================
  ragas-eval:
    build:
      context: ../mcp-servers/ragas-eval
      dockerfile: Dockerfile
    container_name: answer_ragas_eval
    profiles:
      - eval
    ports:
      - "8090:8090"
    environment:
      - KNOWLEDGE_RPC_ADDR=http://answer_knowledge_service:4326
      - KNOWLEDGE_SERVICE_ADDR=http://answer_mcp_knowledge:8001
      - LLM_API_KEY=${RAGAS_LLM_API_KEY}
      - LLM_BASE_URL=${RAGAS_LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${RAGAS_LLM_MODEL:-gpt-4o-mini}
      - EMBEDDING_API_KEY=${RAGAS_EMBEDDING_API_KEY}
      - EMBEDDING_BASE_URL=${RAGAS_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_MODEL=${RAGAS_EMBEDDING_MODEL:-text-embedding-3-small}
    networks:
      - answer-net
    depends_on:
      - knowledge-service
    restart: unless-stopped

volumes:
  postgres_data:
  mysql_data:
  garnet_data:
  kafka_1_data:
  kafka_2_data:
  qdrant_data:
  meilisearch_data:
  seaweedfs_master_data:
  seaweedfs_volume_data:
  seaweedfs_filer_data:
  mem0_postgres_data:
  clickhouse_data:
  clickhouse_logs:
  rerank_model_cache:
  neo4j_data:
  neo4j_logs:

networks:
  answer-net:
    driver: bridge
