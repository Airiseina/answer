name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: Go Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1
          working-directory: .
          args: --timeout=5m

      - name: go vet (all modules)
        run: |
          for mod in $(find . -name "go.mod" -not -path "./.git/*"); do
            dir=$(dirname "$mod")
            echo "::group::go vet $dir"
            (cd "$dir" && go vet ./...)
            echo "::endgroup::"
          done

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    needs: go-lint
    strategy:
      matrix:
        module:
          - api_gateway
          - msg_gateway
          - kitex_service/bot_service
          - kitex_service/chat_service
          - kitex_service/group_service
          - kitex_service/knowledge_service
          - kitex_service/user_service
          - kitex_service/work_service
          - pkg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        run: |
          cd ${{ matrix.module }}
          go build ./...

      - name: Verify go.mod tidy
        run: |
          cd ${{ matrix.module }}
          go mod tidy
          git diff --exit-code go.mod go.sum

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    needs: go-build
    strategy:
      matrix:
        module:
          - api_gateway
          - msg_gateway
          - kitex_service/bot_service
          - kitex_service/chat_service
          - kitex_service/group_service
          - kitex_service/knowledge_service
          - kitex_service/user_service
          - kitex_service/work_service
          - pkg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Test
        run: |
          cd ${{ matrix.module }}
          go test -race -count=1 ./...

  python-lint:
    name: Python Lint (MCP Servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff

      - name: Ruff check
        run: ruff check mcp-servers/

      - name: Ruff format check
        run: ruff format --check mcp-servers/

  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [go-build, python-lint]
    if: github.event_name == 'push'
    strategy:
      matrix:
        service:
          - api_gateway
          - msg_gateway
          - kitex_service/bot_service
          - kitex_service/chat_service
          - kitex_service/group_service
          - kitex_service/knowledge_service
          - kitex_service/user_service
          - kitex_service/work_service
          - mcp-knowledge
          - mcp-translate
          - mcp-weather
          - mcp-brave-search
          - mcp-timeserver
          - test-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service == 'mcp-knowledge' && 'mcp-servers/knowledge/Dockerfile' || matrix.service == 'mcp-translate' && 'mcp-servers/translate/Dockerfile' || matrix.service == 'mcp-weather' && 'deploy/docker/Dockerfile.mcp-weather' || matrix.service == 'mcp-brave-search' && 'deploy/docker/Dockerfile.mcp-brave-search' || matrix.service == 'mcp-timeserver' && 'deploy/docker/Dockerfile.mcp-timeserver' || matrix.service == 'test-frontend' && 'web/test_frontend/Dockerfile' || format('{0}/Dockerfile', matrix.service) }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
