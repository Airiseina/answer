  postgres:
    image: postgres:16
    container_name: answer_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: answer_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - answer-net

  mysql:
    image: mysql:8.0
    container_name: answer_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: answer
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/connect
    networks:
      - answer-net

  garnet:
    image: ghcr.io/microsoft/garnet-alpine:1.1.8
    container_name: answer_garnet
    ports:
      - "6379:6379"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - garnet_data:/data
    networks:
      - answer-net
