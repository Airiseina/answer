## example
server:
  port: 4326

mysql:
  host: "localhost"
  port: "3306"
  user: "root"
  password: "123456"
  name: "answer"

etcd:
  Addr: "127.0.0.1:2379"

otel:
  Addr: "localhost:4317"

kafka:
  brokers: "localhost:9094"
  topic:
    doc_parse: "doc-parse"
  group:
    knowledge: "knowledge-group"

qdrant:
  host: "localhost"
  port: 6334

meilisearch:
  host: "http://localhost:7700"
  api_key: "Airiseina_answer_key"

seaweedfs:
  filer_url: "http://127.0.0.1:8888"
  base_path: "/chat"
  public_url: "/files"

embedding:
  api_key: ""
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  model: "doubao-embedding-vision-251215"

llm:
  api_key: ""
  # 火山方舟 OpenAI 兼容端点，与 embedding.base_url 可复用
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  # 对话模型 ID，用于实体抽取/关键词抽取等图谱构建任务
  # 配置缺失时实体抽取将降级为 N-gram 正则方案
  model: "doubao-seed-1-8-251228"

rerank:
  enabled: false
  # 模式: jina(云端API,免下载模型) 或 vllm(本地GPU部署)
  mode: "jina"
  # jina模式: base_url=https://api.jina.ai/v1, model=jina-reranker-v2-base-multilingual
  # vllm模式: base_url=http://localhost:8010/v1, model=BAAI/bge-reranker-v2-m3
  base_url: "https://api.jina.ai/v1"
  model: "jina-reranker-v2-base-multilingual"
  top_n: 3
  api_key: ""

neo4j:
  uri: "bolt://localhost:7687"
  username: "neo4j"
  password: "password"
  max_connections: 10
