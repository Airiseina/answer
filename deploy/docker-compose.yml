  postgres:
    image: postgres:16
    container_name: answer_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DBNAME:-answer_chat}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - answer-net

  # ClickHouse 冷库：存储归档的历史消息
  # 选择 ClickHouse 而非 SeaweedFS 的原因：
  # 1. SeaweedFS 是文件存储，适合存图片/文件等二进制数据，不适合存结构化消息数据做查询
  # 2. ClickHouse 是列式数据库，天然适合海量消息的存储和分析查询
  # 3. 支持按月分区、TTL 自动过期，与 PostgreSQL 分区策略一致
  # 4. Go 有成熟的 clickhouse-go/v2 客户端
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: answer_clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-answer_cold}
    ports:
      - "8123:8123"   # HTTP 接口
      - "9000:9000"   # Native TCP 接口（Go 客户端使用此端口）
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - answer-net

  mysql:
    image: mysql:8.0
    container_name: answer_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_NAME:-answer}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/connect
    networks:
      - answer-net

  garnet:
    image: ghcr.io/microsoft/garnet-alpine:1.1.8
    container_name: answer_garnet
    ports:
      - "6379:6379"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - garnet_data:/data
    networks:
      - answer-net

  kafka-1:
    image: apache/kafka:latest
    container_name: answer_kafka-1
    user: root
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9094:9094"
    volumes:
      - kafka_1_data:/tmp/kafka-logs
    networks:
      - answer-net

  kafka-2:
    image: apache/kafka:latest
    container_name: answer_kafka-2
    user: root
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9095:9095"
    volumes:
      - kafka_2_data:/tmp/kafka-logs
    networks:
      - answer-net
    depends_on:
      - kafka-1

  qdrant:
    image: qdrant/qdrant:latest
    container_name: answer_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - answer-net

  seaweedfs-master:
    image: chrislusf/seaweedfs:3.78
    container_name: answer_seaweedfs_master
    command: "master -ip=seaweedfs-master -port=9333"
    ports:
      - "9333:9333"
    volumes:
      - seaweedfs_master_data:/data
    networks:
      - answer-net

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.78
    container_name: answer_seaweedfs_volume
    command: "volume -ip=seaweedfs-volume -port=8080 -mserver=seaweedfs-master:9333 -dir=/data"
    ports:
      - "8081:8080"
    volumes:
      - seaweedfs_volume_data:/data
    networks:
      - answer-net
    depends_on:
      - seaweedfs-master

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.78
    container_name: answer_seaweedfs_filer
    command: "filer -ip=seaweedfs-filer -master=seaweedfs-master:9333"
    ports:
      - "8888:8888"
    volumes:
      - seaweedfs_filer_data:/data
    networks:
      - answer-net
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume

  etcd:
    image: quay.io/coreos/etcd:v3.6.8
    container_name: answer_etcd
    command:
      - /usr/local/bin/etcd
      - --name=answer_etcd
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    networks:
      - answer-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: answer_jaeger
    ports:
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - answer-net

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: answer_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks:
      - answer-net
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:latest
    container_name: answer_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - answer-net

  # ==========================================
  # Mem0 记忆层 (自部署 MCP Server)
  # ==========================================
  mem0-postgres:
    image: pgvector/pgvector:pg16
    container_name: answer_mem0_postgres
    environment:
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: mem0_password
      POSTGRES_DB: mem0
    volumes:
      - mem0_postgres_data:/var/lib/postgresql/data
    networks:
      - answer-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp-mem0:
    build:
      context: ../mcp-servers/mem0
      dockerfile: Dockerfile
    container_name: answer_mcp_mem0
    ports:
      - "9004:8000"
    environment:
      - MEM0_API_KEY=${MEM0_API_KEY:-}
      - MEM0_HOST=mem0-postgres
      - MEM0_PORT=5432
      - MEM0_USER=mem0
      - MEM0_PASSWORD=mem0_password
      - MEM0_DB=mem0
      - QDRANT_HOST=answer_qdrant
      - QDRANT_PORT=6333
      - LLM_MODEL=${MEM0_LLM_MODEL}
      - LLM_BASE_URL=${MEM0_LLM_BASE_URL}
      - LLM_API_KEY=${MEM0_LLM_API_KEY}
      - EMBEDDING_MODEL=${MEM0_EMBEDDING_MODEL}
      - EMBEDDING_BASE_URL=${MEM0_EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${MEM0_EMBEDDING_API_KEY}
      - EMBEDDING_PROVIDER=${MEM0_EMBEDDING_PROVIDER:-volcengine}
      - EMBEDDING_DIMS=${MEM0_EMBEDDING_DIMS}
      - OPENAI_API_KEY=${MEM0_LLM_API_KEY}
    depends_on:
      mem0-postgres:
        condition: service_healthy
    networks:
      - answer-net
    restart: unless-stopped

  # ==========================================
  # MCP SSE Servers
  # ==========================================
  mcp-weather:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.mcp-weather
    container_name: answer_mcp_weather
    ports:
      - "9001:8080"
    networks:
      - answer-net
    restart: unless-stopped

  mcp-timeserver:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.mcp-timeserver
    container_name: answer_mcp_timeserver
    ports:
      - "9005:8000"
    networks:
      - answer-net
    restart: unless-stopped

  # ==========================================
  # Knowledge 知识库 MCP Server
  # ==========================================
  mcp-knowledge:
    build:
      context: ../mcp-servers/knowledge
      dockerfile: Dockerfile
    container_name: answer_mcp_knowledge
    ports:
      - "9006:8001"
    environment:
      - KNOWLEDGE_SERVICE_ADDR=http://host.docker.internal:4326
      - MYSQL_HOST=answer_mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DB=answer
      - QDRANT_HOST=answer_qdrant
      - QDRANT_PORT=6334
      - QDRANT_HTTP_PORT=6333
      - EMBEDDING_MODEL=${KNOWLEDGE_EMBEDDING_MODEL}
      - EMBEDDING_BASE_URL=${KNOWLEDGE_EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${KNOWLEDGE_DOUBAO_EMBEDDING_API_KEY}
      - EMBEDDING_DIMS=${KNOWLEDGE_EMBEDDING_DIMS}
    networks:
      - answer-net
    restart: unless-stopped

  # ==========================================
  # SearXNG 搜索引擎 + MCP Server
  # ==========================================
  searxng:
    image: searxng/searxng:latest
    container_name: answer_searxng
    ports:
      - "9007:8080"
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - answer-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/search?format=json&q=healthcheck&language=zh-CN || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s

  mcp-searxng:
    build:
      context: ../mcp-servers/searxng
      dockerfile: Dockerfile
    container_name: answer_mcp_searxng
    ports:
      - "9008:8001"
    environment:
      - SEARXNG_BASE_URL=http://answer_searxng:8080
      - SEARXNG_TIMEOUT=8
    networks:
      - answer-net
    depends_on:
      searxng:
        condition: service_healthy
    restart: unless-stopped
  

  grafana:
    image: grafana/grafana:latest
    container_name: answer_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - answer-net
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mysql_data:
  garnet_data:
  kafka_1_data:
  kafka_2_data:
  qdrant_data:
  seaweedfs_master_data:
  seaweedfs_volume_data:
  seaweedfs_filer_data:
  mem0_postgres_data:
  clickhouse_data:
  clickhouse_logs:

networks:
  answer-net:
    driver: bridge
