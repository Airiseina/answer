global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 10s

  - job_name: 'msg_gateway'
    static_configs:
      - targets: ['answer_msg_gateway:8081']
    scrape_interval: 10s
    metrics_path: /metrics
