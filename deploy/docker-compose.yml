#      - mysql
#      - etcd
#      - kafka-1
#      - qdrant
#      - otel-collector

  grafana:
    image: grafana/grafana:latest
    container_name: answer_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - answer-net
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mysql_data:
  garnet_data:
  kafka_1_data:
  kafka_2_data:
  qdrant_data:
  seaweedfs_master_data:
  seaweedfs_volume_data:
  seaweedfs_filer_data:
  mem0_postgres_data:

networks:
  answer-net:
    driver: bridge
