  qdrant:
    image: qdrant/qdrant:latest
    container_name: answer_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - answer-net

  seaweedfs-master:
    image: chrislusf/seaweedfs:3.78
    container_name: answer_seaweedfs_master
    command: "master -ip=seaweedfs-master -port=9333"
    ports:
      - "9333:9333"
    volumes:
      - seaweedfs_master_data:/data
    networks:
      - answer-net

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.78
    container_name: answer_seaweedfs_volume
    command: "volume -ip=seaweedfs-volume -port=8080 -mserver=seaweedfs-master:9333 -dir=/data"
    ports:
      - "8081:8080"
    volumes:
      - seaweedfs_volume_data:/data
    networks:
      - answer-net
    depends_on:
      - seaweedfs-master

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.78
    container_name: answer_seaweedfs_filer
    command: "filer -ip=seaweedfs-filer -master=seaweedfs-master:9333"
    ports:
      - "8888:8888"
    volumes:
      - seaweedfs_filer_data:/data
    networks:
      - answer-net
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume

  etcd:
    image: quay.io/coreos/etcd:v3.6.8
    container_name: answer_etcd
    command:
      - /usr/local/bin/etcd
      - --name=answer_etcd
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    networks:
      - answer-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: answer_jaeger
    ports:
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - answer-net

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: answer_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
    networks:
      - answer-net
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:latest
    container_name: answer_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - answer-net

  grafana:
    image: grafana/grafana:latest
    container_name: answer_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - answer-net
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mysql_data:
  garnet_data:
#  kafka_1_data:
#  kafka_2_data:
  qdrant_data:
  seaweedfs_master_data:
  seaweedfs_volume_data:
  seaweedfs_filer_data:

networks:
  answer-net:
    driver: bridge
