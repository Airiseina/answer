name: Release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api_gateway
          - msg_gateway
          - kitex_service/bot_service
          - kitex_service/chat_service
          - kitex_service/group_service
          - kitex_service/knowledge_service
          - kitex_service/user_service
          - kitex_service/work_service
          - mcp-knowledge
          - mcp-translate
          - mcp-weather
          - mcp-brave-search
          - mcp-timeserver
          - test-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service == 'mcp-knowledge' && 'mcp-servers/knowledge/Dockerfile' || matrix.service == 'mcp-translate' && 'mcp-servers/translate/Dockerfile' || matrix.service == 'mcp-weather' && 'deploy/docker/Dockerfile.mcp-weather' || matrix.service == 'mcp-brave-search' && 'deploy/docker/Dockerfile.mcp-brave-search' || matrix.service == 'mcp-timeserver' && 'deploy/docker/Dockerfile.mcp-timeserver' || matrix.service == 'test-frontend' && 'web/test_frontend/Dockerfile' || format('{0}/Dockerfile', matrix.service) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
