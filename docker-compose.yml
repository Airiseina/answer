services:
  traefik:
    image: traefik:v3.0
    container_name: answer_traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - answer-net

  mysql:
    image: mysql:8.0
    container_name: answer_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: answer
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/connect
    networks:
      - answer-net

  redis:
    image: redis:latest
    container_name: answer_redis
    ports:
      - "6379:6379"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - redis_data:/data
    networks:
      - answer-net

  kafka-1:
    image: apache/kafka:latest
    container_name: answer_kafka-1
    user: root
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9094:9094"
    volumes:
      - kafka_1_data:/tmp/kafka-logs
    networks:
      - answer-net

  kafka-2:
    image: apache/kafka:latest
    container_name: answer_kafka-2
    user: root
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9095:9095"
    volumes:
      - kafka_2_data:/tmp/kafka-logs
    networks:
      - answer-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: answer_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - answer-net

  minio:
    image: minio/minio:latest
    container_name: answer_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - answer-net

  etcd:
   image: quay.io/coreos/etcd:v3.6.8
   container_name: answer_etcd
   command:
     - /usr/local/bin/etcd
     - --name=answer_etcd
     - --advertise-client-urls=http://0.0.0.0:2379
     - --listen-client-urls=http://0.0.0.0:2379
   ports:
     - "2379:2379"
   networks:
     -  answer-net

volumes:
  mysql_data:
  redis_data:
  kafka_1_data:
  kafka_2_data:
  qdrant_data:
  minio_data:

networks:
  answer-net:
    driver: bridge
