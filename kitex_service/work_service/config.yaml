## example
etcd:
  Addr: "127.0.0.1:2379"

otel:
  Addr: "localhost:4317"

gateway:
  addr: "127.0.0.1:8082"

kafka:
  brokers: "127.0.0.1:9094"

mcp:
  mem0_url: "http://localhost:9004/sse"
  knowledge_url: "http://localhost:9006/sse"
  searxng_url: "http://localhost:9008/sse"
  weather_url: "http://localhost:9001/sse"
  timeserver_url: "http://localhost:9005/sse"
  call_timeout: 20        # MCP工具调用超时(秒)
  retry:
    max_attempts: 2       # MCP调用最大重试次数(不含首次调用)
    initial_interval: 1   # MCP重试初始间隔(秒)
  fallback:
    enabled: true         # MCP降级开关

seaweedfs:
  filer_url: "http://127.0.0.1:8888"   # SeaweedFS Filer内网地址
  base_path: "/chat"                    # 存储基础路径
  public_url: "/files"                  # 公开访问URL前缀

image:
  max_size: 5242880                     # 图片最大5MB，超出则不识图
