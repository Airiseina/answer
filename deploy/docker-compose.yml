  postgres:
    image: postgres:16
    container_name: answer_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: answer_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - answer-net

  mysql:
    image: mysql:8.0
    container_name: answer_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: answer
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/connect
    networks:
      - answer-net

  garnet:
    image: ghcr.io/microsoft/garnet-alpine:1.1.8
    container_name: answer_garnet
    ports:
      - "6379:6379"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - garnet_data:/data
    networks:
      - answer-net

  kafka-1:
    image: apache/kafka:latest
    container_name: answer_kafka-1
    user: root
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9094:9094"
    volumes:
      - kafka_1_data:/tmp/kafka-logs
    networks:
      - answer-net

  kafka-2:
    image: apache/kafka:latest
    container_name: answer_kafka-2
    user: root
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9095:9095"
    volumes:
      - kafka_2_data:/tmp/kafka-logs
    networks:
      - answer-net
    depends_on:
      - kafka-1

  qdrant:
    image: qdrant/qdrant:latest
    container_name: answer_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - answer-net

  seaweedfs-master:
    image: chrislusf/seaweedfs:3.78
    container_name: answer_seaweedfs_master
    command: "master -ip=seaweedfs-master -port=9333"
    ports:
      - "9333:9333"
    volumes:
      - seaweedfs_master_data:/data
    networks:
      - answer-net

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.78
    container_name: answer_seaweedfs_volume
    command: "volume -ip=seaweedfs-volume -port=8080 -mserver=seaweedfs-master:9333 -dir=/data"
    ports:
      - "8081:8080"
    volumes:
      - seaweedfs_volume_data:/data
    networks:
      - answer-net
    depends_on:
      - seaweedfs-master

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.78
    container_name: answer_seaweedfs_filer
    command: "filer -ip=seaweedfs-filer -master=seaweedfs-master:9333"
    ports:
      - "8888:8888"
    volumes:
      - seaweedfs_filer_data:/data
    networks:
      - answer-net
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume

  etcd:
    image: quay.io/coreos/etcd:v3.6.8
    container_name: answer_etcd
    command:
      - /usr/local/bin/etcd
      - --name=answer_etcd
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    networks:
      - answer-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: answer_jaeger
    ports:
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - answer-net

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: answer_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks:
      - answer-net
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:latest
    container_name: answer_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - answer-net

  # ==========================================
  # Mem0 记忆层 (自部署 MCP Server)
  # ==========================================
  mem0-postgres:
    image: pgvector/pgvector:pg16
    container_name: answer_mem0_postgres
    environment:
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: mem0_password
      POSTGRES_DB: mem0
    volumes:
      - mem0_postgres_data:/var/lib/postgresql/data
    networks:
      - answer-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp-mem0:
    build:
      context: ../mcp-servers/mem0
      dockerfile: ../mcp-servers/mem0/Dockerfile
    container_name: answer_mcp_mem0
    ports:
      - "9004:8000"
    environment:
      - MEM0_API_KEY=${MEM0_API_KEY:-}
      - MEM0_HOST=mem0-postgres
      - MEM0_PORT=5432
      - MEM0_USER=mem0
      - MEM0_PASSWORD=mem0_password
      - MEM0_DB=mem0
      - QDRANT_HOST=answer_qdrant
      - QDRANT_PORT=6333
      - LLM_MODEL=${MEM0_LLM_MODEL}
      - LLM_BASE_URL=${MEM0_LLM_BASE_URL}
      - LLM_API_KEY=${MEM0_LLM_API_KEY}
      - EMBEDDING_MODEL=${MEM0_EMBEDDING_MODEL}
      - EMBEDDING_BASE_URL=${MEM0_EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${MEM0_EMBEDDING_API_KEY}
      - EMBEDDING_PROVIDER=${MEM0_EMBEDDING_PROVIDER:-volcengine}
      - EMBEDDING_DIMS=${MEM0_EMBEDDING_DIMS}
      - OPENAI_API_KEY=${MEM0_LLM_API_KEY}
    depends_on:
      mem0-postgres:
        condition: service_healthy
    networks:
      - answer-net
    restart: unless-stopped

  # ==========================================
  # MCP SSE Servers
  # ==========================================
  mcp-weather:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.mcp-weather
    container_name: answer_mcp_weather
    ports:
      - "9001:8080"
    networks:
      - answer-net
    restart: unless-stopped

  mcp-brave-search:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.mcp-brave-search
    container_name: answer_mcp_brave_search
    ports:
      - "9002:8000"
    environment:
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
    networks:
      - answer-net
    restart: unless-stopped

  mcp-translate:
    build:
      context: ../mcp-servers/translate
      dockerfile: Dockerfile
    container_name: answer_mcp_translate
    ports:
      - "9003:8000"
    environment:
      - TRANSLATE_PROVIDER=${TRANSLATE_PROVIDER:-mymemory}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
    networks:
      - answer-net
    restart: unless-stopped

  mcp-timeserver:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.mcp-timeserver
    container_name: answer_mcp_timeserver
    ports:
      - "9005:8000"
    networks:
      - answer-net
    restart: unless-stopped

  # ==========================================
  # Knowledge 知识库 MCP Server
  # ==========================================
  mcp-knowledge:
    build:
      context: ../mcp-servers/knowledge
      dockerfile: Dockerfile
    container_name: answer_mcp_knowledge
    ports:
      - "9006:8001"
    environment:
      - KNOWLEDGE_SERVICE_ADDR=http://host.docker.internal:4326
      - MYSQL_HOST=answer_mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DB=answer
      - QDRANT_HOST=answer_qdrant
      - QDRANT_PORT=6334
      - QDRANT_HTTP_PORT=6333
      - EMBEDDING_MODEL=${KNOWLEDGE_EMBEDDING_MODEL}
      - EMBEDDING_BASE_URL=${KNOWLEDGE_EMBEDDING_BASE_URL}
      - EMBEDDING_API_KEY=${KNOWLEDGE_DOUBAO_EMBEDDING_API_KEY}
      - EMBEDDING_DIMS=${KNOWLEDGE_EMBEDDING_DIMS}
    networks:
      - answer-net
    restart: unless-stopped

  # ==========================================
  # Knowledge Service (Kitex 微服务)
  # ==========================================
